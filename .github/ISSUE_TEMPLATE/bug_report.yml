name: Bug report
description: Report something that is broken or behaves unexpectedly
title: "[Bug]: "
labels:
  - bug
  - needs-triage
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve QuiverDL. Please search existing issues before filing a new report.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: I removed passwords, access tokens, cookies, private URLs, personal filenames, and other identifying download details from this report.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the behavior and what you were trying to download.
      placeholder: QuiverDL...
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open QuiverDL
        2. Add a download
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - Linux
        - macOS
        - Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: QuiverDL version or commit
      placeholder: v0.1.0 or a commit SHA
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste only sanitized logs. This is automatically formatted as code.
      render: shell

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add screenshots or other details that may help us reproduce the problem.
