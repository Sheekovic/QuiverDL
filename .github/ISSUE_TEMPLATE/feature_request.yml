name: Feature request
description: Suggest an improvement for QuiverDL
title: "[Feature]: "
labels:
  - enhancement
  - needs-triage
body:
  - type: markdown
    attributes:
      value: |
        Thanks for sharing an idea. Explain the user problem first so contributors can evaluate possible solutions.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and Discussions for this idea.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Who has this problem, and when does it occur?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the experience you would like QuiverDL to provide.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What workarounds or different designs have you considered?

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I am interested in helping implement this feature.
