name: Tag reviewed release

on:
  push:
    branches:
      - main
    paths:
      - ".release-please-manifest.json"

permissions:
  contents: write

concurrency:
  group: version-tag
  cancel-in-progress: false

jobs:
  tag:
    name: Create the validated version tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - name: Validate synchronized versions
        run: node scripts/validate-store-packaging.mjs
      - name: Create an annotated tag exactly once
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        shell: bash
        run: |
          version="$(node -p "JSON.parse(require('fs').readFileSync('.release-please-manifest.json', 'utf8'))['.']")"
          [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          tag="v$version"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            tagged_commit="$(git ls-remote origin "refs/tags/$tag^{}" | awk '{print $1}')"
            if [[ -z "$tagged_commit" || "$tagged_commit" != "$GITHUB_SHA" ]]; then
              echo "::error::Existing $tag resolves to '${tagged_commit:-<not an annotated tag>}' instead of reviewed commit $GITHUB_SHA."
              exit 1
            fi
            echo "$tag already exists at the reviewed release commit."
          else
            test -n "$RELEASE_TOKEN"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$tag" -m "QuiverDL $version"
            git push "https://x-access-token:${RELEASE_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "refs/tags/$tag"
          fi
      - name: Mark the merged release PR as tagged
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        shell: bash
        run: |
          test -n "$GH_TOKEN"
          pulls="$(gh api "/repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls")"
          release_pr="$(jq -er --arg sha "$GITHUB_SHA" '
            [.[] | select(
              .merged_at != null and
              .merge_commit_sha == $sha and
              .head.ref == "release-please--branches--main--components--QuiverDL"
            )] |
            if length == 1 then .[0].number else error("expected one merged release PR") end
          ' <<< "$pulls")"
          labels="$(gh api "/repos/$GITHUB_REPOSITORY/issues/$release_pr/labels?per_page=100")"
          if jq -e 'any(.name == "autorelease: pending")' <<< "$labels" >/dev/null; then
            gh api --method DELETE \
              "/repos/$GITHUB_REPOSITORY/issues/$release_pr/labels/autorelease%3A%20pending" \
              >/dev/null
          else
            echo "Release PR #$release_pr no longer has the pending label."
          fi
