name: Prepare release

on:
  push:
    branches:
      - main
  workflow_dispatch:
  workflow_run:
    workflows: [Release]
    types: [completed]
  pull_request:
    paths:
      - ".github/workflows/release-please.yml"
      - "scripts/check-release-readiness.mjs"
      - "scripts/test-check-release-readiness.mjs"

permissions:
  contents: read

concurrency:
  group: prepare-release
  cancel-in-progress: false

jobs:
  release-automation-tests:
    name: Test release publication guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - run: node --test scripts/test-check-release-readiness.mjs

  release-please:
    name: Open or update the reviewed release PR
    needs: release-automation-tests
    if: >-
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main' &&
      (
        github.event_name != 'workflow_run' ||
        (
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_repository.full_name == github.repository &&
          (github.event.workflow_run.event == 'push' ||
           github.event.workflow_run.event == 'workflow_dispatch')
        )
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - name: Wait for the current version to finish publication
        id: readiness
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check-release-readiness.mjs
      - name: Require the release automation token
        if: steps.readiness.outputs.ready == 'true'
        env:
          RELEASE_TOKEN_CONFIGURED: ${{ secrets.RELEASE_PLEASE_TOKEN != '' }}
        shell: bash
        run: |
          if [[ "$RELEASE_TOKEN_CONFIGURED" != "true" ]]; then
            echo "::error::Add the RELEASE_PLEASE_TOKEN repository secret with Contents, Pull requests, and Issues write access."
            exit 1
          fi
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        if: steps.readiness.outputs.ready == 'true'
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
      - name: Resolve the generated release branch
        id: release-branch
        if: steps.release.outputs.prs_created == 'true'
        env:
          RELEASE_PR_JSON: ${{ steps.release.outputs.pr }}
        shell: bash
        run: |
          release_branch="$(jq -er '.headBranchName | strings' <<< "$RELEASE_PR_JSON")"
          [[ "$release_branch" =~ ^[A-Za-z0-9._/-]+$ ]]
          [[ "$release_branch" != /* && "$release_branch" != *..* ]]
          echo "name=$release_branch" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.release.outputs.prs_created == 'true'
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ steps.release-branch.outputs.name }}
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
      - name: Check out trusted release tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.release.outputs.prs_created == 'true'
        with:
          path: .trusted-release-tools
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        if: steps.release.outputs.prs_created == 'true'
        with:
          node-version: 22
      - name: Synchronize the generated release lockfile
        id: synchronize
        if: steps.release.outputs.prs_created == 'true'
        env:
          QUIVERDL_RELEASE_REPOSITORY: ${{ github.workspace }}
          RELEASE_BRANCH: ${{ steps.release-branch.outputs.name }}
        shell: bash
        run: |
          [[ "$RELEASE_BRANCH" =~ ^[A-Za-z0-9._/-]+$ ]]
          [[ "$RELEASE_BRANCH" != /* && "$RELEASE_BRANCH" != *..* ]]
          node .trusted-release-tools/scripts/sync-release-lockfile.mjs
          node .trusted-release-tools/scripts/validate-store-packaging.mjs
          git add -- Cargo.lock
          if git diff --cached --quiet; then
            echo "Cargo.lock already matches the generated release version."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -c core.hooksPath=/dev/null commit -m "chore: synchronize release lockfile"
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Push the synchronized release branch
        if: steps.synchronize.outputs.changed == 'true'
        env:
          RELEASE_BRANCH: ${{ steps.release-branch.outputs.name }}
          RELEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        shell: bash
        run: |
          test -n "$RELEASE_TOKEN"
          [[ "$RELEASE_BRANCH" =~ ^[A-Za-z0-9._/-]+$ ]]
          [[ "$RELEASE_BRANCH" != /* && "$RELEASE_BRANCH" != *..* ]]
          git -c core.hooksPath=/dev/null -c credential.helper= push \
            "https://x-access-token:${RELEASE_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:refs/heads/$RELEASE_BRANCH"
