name: Prepare release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: prepare-release
  cancel-in-progress: false

jobs:
  release-please:
    name: Open or update the reviewed release PR
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.release.outputs.prs_created == 'true'
        with:
          fetch-depth: 0
          ref: ${{ fromJSON(steps.release.outputs.pr).headBranchName }}
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        if: steps.release.outputs.prs_created == 'true'
        with:
          node-version: 22
      - name: Synchronize the generated release lockfile
        if: steps.release.outputs.prs_created == 'true'
        env:
          RELEASE_BRANCH: ${{ fromJSON(steps.release.outputs.pr).headBranchName }}
        shell: bash
        run: |
          [[ "$RELEASE_BRANCH" =~ ^[A-Za-z0-9._/-]+$ ]]
          [[ "$RELEASE_BRANCH" != /* && "$RELEASE_BRANCH" != *..* ]]
          node scripts/sync-release-lockfile.mjs
          node scripts/validate-store-packaging.mjs
          git add -- Cargo.lock
          if git diff --cached --quiet; then
            echo "Cargo.lock already matches the generated release version."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: synchronize release lockfile"
          git push origin "HEAD:refs/heads/$RELEASE_BRANCH"
