name: Microsoft Store MSIX

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: store-msix-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Build Store-ready x64 MSIX
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-18
      - name: Install frontend dependencies
        run: npm ci
        working-directory: apps/desktop
      - name: Validate release and Store identities
        run: node scripts/validate-store-packaging.mjs
      - name: Build and validate unsigned Store package
        shell: powershell
        run: .\scripts\package-msix.ps1 -OutputDirectory $env:RUNNER_TEMP\store
      - name: Upload Partner Center submission artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: QuiverDL-Microsoft-Store-x64
          path: ${{ runner.temp }}/store/*.msix
          if-no-files-found: error
          retention-days: 30
