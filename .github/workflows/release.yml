name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing annotated v* tag to release
        required: true
        type: string
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "apps/desktop/src-tauri/tauri.updater.conf.json.template"
      - "scripts/generate-update-manifest.mjs"
      - "scripts/prepare-updater-config.mjs"

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  preflight:
    name: Validate release identity
    runs-on: ubuntu-latest
    outputs:
      release_commit: ${{ steps.release-identity.outputs.commit }}
      workflow_commit: ${{ steps.release-identity.outputs.workflow_commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}
      - name: Require an annotated tag on reviewed main history
        id: release-identity
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          test "$RELEASE_TAG" = "v$(cat version.txt)"
          tag_ref="refs/tags/$RELEASE_TAG"
          test "$(git cat-file -t "$tag_ref")" = "tag"
          tag_commit="$(git rev-list -n 1 "$tag_ref")"
          test "$tag_commit" = "$(git rev-parse HEAD)"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$tag_commit" FETCH_HEAD
          echo "commit=$tag_commit" >> "$GITHUB_OUTPUT"
          workflow_commit="$tag_commit"
          if test "$GITHUB_EVENT_NAME" = "workflow_dispatch"; then
            test "$GITHUB_REF" = "refs/heads/main"
            git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD
            workflow_commit="$GITHUB_SHA"
          fi
          echo "workflow_commit=$workflow_commit" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - name: Require tag, desktop, extension, and store versions to match
        run: node scripts/validate-store-packaging.mjs

  linux-validate:
    name: Validate Linux x64 packages
    needs: preflight
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-18
        with:
          targets: x86_64-unknown-linux-gnu
      - name: Cache Cargo
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            !target/**/bundle
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Install frontend dependencies
        run: npm ci
        working-directory: apps/desktop
      - name: Build native messaging host
        run: cargo build --locked --release -p quiver-native-host --target x86_64-unknown-linux-gnu
      - name: Validate Linux bundles
        run: npm run tauri -- build --bundles deb,rpm,appimage
        working-directory: apps/desktop

  linux:
    name: Signed Linux x64 packages
    needs: preflight
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-22.04
    environment: release
    env:
      RELEASE_COMMIT: ${{ needs.preflight.outputs.release_commit }}
      WORKFLOW_COMMIT: ${{ needs.preflight.outputs.workflow_commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.release_commit }}
      - name: Reconfirm the immutable release tag
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          remote_commit="$(git ls-remote --exit-code origin "refs/tags/$RELEASE_TAG^{}" | cut -f 1)"
          test "$remote_commit" = "$RELEASE_COMMIT"
      - name: Check out reviewed recovery tooling
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.workflow_commit }}
          path: .release-tools
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-18
        with:
          targets: x86_64-unknown-linux-gnu
      - name: Cache Cargo
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            !target/**/bundle
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Install frontend dependencies
        run: npm ci
        working-directory: apps/desktop
      - name: Build native messaging host
        run: cargo build --locked --release -p quiver-native-host --target x86_64-unknown-linux-gnu
      - name: Require protected updater signing inputs
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          test -n "$TAURI_UPDATER_PUBLIC_KEY"
          test -n "$TAURI_SIGNING_PRIVATE_KEY"
          test -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD"
      - name: Prepare fail-closed updater configuration
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
        run: node scripts/prepare-updater-config.mjs
      - name: Build package-manager Linux bundles without the direct updater
        run: npm run tauri -- build --bundles deb,rpm
        working-directory: apps/desktop
      - name: Build the signed updater-enabled AppImage
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_QUIVERDL_UPDATER: "true"
        run: npm run tauri -- build --bundles appimage --config src-tauri/tauri.updater.conf.json
        working-directory: apps/desktop
      - name: Create the draft release and upload Linux bundles
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          remote_commit="$(git ls-remote --exit-code origin "refs/tags/$RELEASE_TAG^{}" | cut -f 1)"
          test "$remote_commit" = "$RELEASE_COMMIT"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = "true"
          else
            gh release create "$RELEASE_TAG" --draft --title "QuiverDL $RELEASE_TAG" --notes "Linux packages are available below. Windows is available from Microsoft Store."
          fi
          shopt -s nullglob
          debs=(target/release/bundle/deb/*.deb)
          rpms=(target/release/bundle/rpm/*.rpm)
          appimages=(target/release/bundle/appimage/*.AppImage)
          test "${#debs[@]}" -eq 1
          test "${#rpms[@]}" -eq 1
          test "${#appimages[@]}" -eq 1
          bundles=("${debs[0]}" "${rpms[0]}" "${appimages[0]}")
          appimage="${appimages[0]}"
          test -f "$appimage.sig"
          gh release upload "$RELEASE_TAG" "${bundles[@]}" "$appimage.sig" --clobber
      - name: Attach Linux bundle checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          remote_commit="$(git ls-remote --exit-code origin "refs/tags/$RELEASE_TAG^{}" | cut -f 1)"
          test "$remote_commit" = "$RELEASE_COMMIT"
          checksum_file="$RUNNER_TEMP/SHA256SUMS-linux-x64.txt"
          while IFS= read -r -d '' bundle; do
            printf '%s  %s\n' "$(sha256sum "$bundle" | cut -d ' ' -f 1)" "$(basename "$bundle")"
          done < <(find \
            target/release/bundle/deb \
            target/release/bundle/rpm \
            target/release/bundle/appimage \
            -maxdepth 1 -type f \
            \( -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \) \
            -print0 | sort -z) > "$checksum_file"
          test -s "$checksum_file"
          gh release upload "$RELEASE_TAG" "$checksum_file" --clobber
      - name: Attach Linux native messaging host archive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          remote_commit="$(git ls-remote --exit-code origin "refs/tags/$RELEASE_TAG^{}" | cut -f 1)"
          test "$remote_commit" = "$RELEASE_COMMIT"
          stage="$RUNNER_TEMP/quiver-native-host-x86_64-unknown-linux-gnu"
          mkdir -p "$stage"
          cp target/x86_64-unknown-linux-gnu/release/quiver-native-host "$stage/"
          cp -R extensions "$stage/"
          cp LICENSE README.md "$stage/"
          archive="$RUNNER_TEMP/QuiverDL-${RELEASE_TAG}-native-host-x86_64-unknown-linux-gnu.tar.gz"
          tar -C "$RUNNER_TEMP" -czf "$archive" "$(basename "$stage")"
          archive_dir=$(dirname "$archive")
          archive_name=$(basename "$archive")
          (cd "$archive_dir" && sha256sum "$archive_name") > "$archive.sha256"
          gh release upload "$RELEASE_TAG" "$archive" "$archive.sha256" --clobber
      - name: Publish the verified updater manifest last
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
        shell: bash
        run: |
          remote_commit="$(git ls-remote --exit-code origin "refs/tags/$RELEASE_TAG^{}" | cut -f 1)"
          test "$remote_commit" = "$RELEASE_COMMIT"
          appimage="$(find . -type f -path '*/release/bundle/appimage/*.AppImage' -print -quit)"
          test -n "$appimage"
          manifest_script="scripts/generate-update-manifest.mjs"
          if test "$GITHUB_EVENT_NAME" = "workflow_dispatch"; then
            test "$(git -C .release-tools rev-parse HEAD)" = "$WORKFLOW_COMMIT"
            manifest_script=".release-tools/scripts/generate-update-manifest.mjs"
          fi
          manifest="$RUNNER_TEMP/latest.json"
          version="${RELEASE_TAG#v}"
          GITHUB_REF_NAME="$RELEASE_TAG" node "$manifest_script" \
            --version "$version" \
            --base-url "https://github.com/Sheekovic/QuiverDL/releases/download/$RELEASE_TAG" \
            --output "$manifest" \
            --platform linux-x86_64 \
            --artifact "linux-x86_64=$appimage"
          gh release upload "$RELEASE_TAG" "$manifest" --clobber

  publish-linux:
    name: Publish Linux release
    needs:
      - preflight
      - linux
      - signed-desktop
      - browser-extensions
    if: >-
      always() &&
      github.event_name != 'pull_request' &&
      needs.linux.result == 'success' &&
      needs.browser-extensions.result == 'success' &&
      (needs.signed-desktop.result == 'success' || needs.signed-desktop.result == 'skipped')
    runs-on: ubuntu-latest
    env:
      RELEASE_COMMIT: ${{ needs.preflight.outputs.release_commit }}
    steps:
      - name: Publish the validated Linux release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          remote_commit="$(git ls-remote --exit-code "https://github.com/${GITHUB_REPOSITORY}.git" "refs/tags/$RELEASE_TAG^{}" | cut -f 1)"
          test "$remote_commit" = "$RELEASE_COMMIT"
          gh release edit "$RELEASE_TAG" --draft=false

  signed-desktop:
    name: ${{ matrix.name }}
    needs:
      - preflight
      - linux
    if: github.event_name != 'pull_request' && vars.ENABLE_SIGNED_RELEASES == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64 installer and portable
            os: windows-latest
            args: --target x86_64-pc-windows-msvc --bundles nsis,msi --config src-tauri/tauri.release.conf.json
            target: x86_64-pc-windows-msvc
          - name: macOS Apple Silicon
            os: macos-latest
            args: --target aarch64-apple-darwin --bundles app,dmg
            target: aarch64-apple-darwin
          - name: macOS Intel
            os: macos-latest
            args: --target x86_64-apple-darwin --bundles app,dmg
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    environment: release
    env:
      RELEASE_COMMIT: ${{ needs.preflight.outputs.release_commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.release_commit }}
      - name: Reconfirm the immutable release tag
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          remote_commit="$(git ls-remote --exit-code origin "refs/tags/$RELEASE_TAG^{}" | cut -f 1)"
          test "$remote_commit" = "$RELEASE_COMMIT"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-18
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Install frontend dependencies
        run: npm ci
        working-directory: apps/desktop

      - name: Require Windows signing credentials
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_CERTIFICATE -or -not $env:WINDOWS_CERTIFICATE_PASSWORD) {
            throw "Signed releases require WINDOWS_CERTIFICATE and WINDOWS_CERTIFICATE_PASSWORD"
          }
      - name: Import Windows signing certificate
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $certificateBytes = [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE)
          $certificatePath = Join-Path $env:RUNNER_TEMP "quiverdl-release.pfx"
          [IO.File]::WriteAllBytes($certificatePath, $certificateBytes)
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $certificate = Import-PfxCertificate -FilePath $certificatePath -CertStoreLocation Cert:\CurrentUser\My -Password $password
          if (-not $certificate.Thumbprint) { throw "The Windows certificate could not be imported" }
          $overlay = @{ bundle = @{ windows = @{ certificateThumbprint = $certificate.Thumbprint; digestAlgorithm = "sha256"; timestampUrl = "http://timestamp.digicert.com" } } } | ConvertTo-Json -Depth 5
          Set-Content -LiteralPath apps/desktop/src-tauri/tauri.release.conf.json -Value $overlay -Encoding UTF8
          "WINDOWS_CERT_THUMBPRINT=$($certificate.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Require Apple signing and notarization credentials
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          test -n "$APPLE_CERTIFICATE" && test -n "$APPLE_CERTIFICATE_PASSWORD" && test -n "$APPLE_ID" && test -n "$APPLE_PASSWORD" && test -n "$APPLE_TEAM_ID" && test -n "$KEYCHAIN_PASSWORD"
      - name: Import Apple Developer ID certificate
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/quiverdl-release.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import "$RUNNER_TEMP/quiverdl-release.p12" -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          identity=$(security find-identity -v -p codesigning build.keychain | awk -F'"' '/Developer ID Application/ {print $2; exit}')
          test -n "$identity"
          echo "APPLE_SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"

      - name: Build native messaging host
        run: cargo build --locked --release -p quiver-native-host --target ${{ matrix.target }}
      - name: Sign and verify Windows native host
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $signTool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signTool) { throw "signtool.exe was not found" }
          $hostPath = "target/${{ matrix.target }}/release/quiver-native-host.exe"
          & $signTool.FullName sign /sha1 $env:WINDOWS_CERT_THUMBPRINT /fd sha256 /tr http://timestamp.digicert.com /td sha256 $hostPath
          if ($LASTEXITCODE -ne 0) { throw "Native host signing failed" }
          & $signTool.FullName verify /pa $hostPath
          if ($LASTEXITCODE -ne 0) { throw "Native host signature verification failed" }
      - name: Sign and verify macOS native host
        if: runner.os == 'macOS'
        run: |
          host="target/${{ matrix.target }}/release/quiver-native-host"
          codesign --force --options runtime --timestamp --sign "$APPLE_SIGNING_IDENTITY" "$host"
          codesign --verify --strict --verbose=2 "$host"
      - name: Reconfirm the release tag before desktop upload
        shell: bash
        run: |
          remote_commit="$(git ls-remote --exit-code origin "refs/tags/$RELEASE_TAG^{}" | cut -f 1)"
          test "$remote_commit" = "$RELEASE_COMMIT"
      - name: Build, sign, and attach desktop bundles
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_SIGNING_IDENTITY: ${{ env.APPLE_SIGNING_IDENTITY }}
        with:
          projectPath: apps/desktop
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: QuiverDL ${{ env.RELEASE_TAG }}
          releaseBody: See the checksums, installation notes, and security documentation included with this release.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Create and attach Windows portable archive
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $remoteCommit = (git ls-remote --exit-code origin "refs/tags/$env:RELEASE_TAG^{}" | ForEach-Object { ($_ -split '\s+')[0] })
          if ($remoteCommit -ne $env:RELEASE_COMMIT) { throw "Release tag moved after validation" }
          $stage = Join-Path $env:RUNNER_TEMP "QuiverDL-portable"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item target/${{ matrix.target }}/release/quiver-desktop.exe, target/${{ matrix.target }}/release/quiver-native-host.exe, LICENSE, README.md -Destination $stage
          Copy-Item extensions -Destination $stage -Recurse
          $archive = Join-Path $env:RUNNER_TEMP "QuiverDL-${{ env.RELEASE_TAG }}-windows-x64-portable.zip"
          Compress-Archive -Path "$stage/*" -DestinationPath $archive
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash.ToLowerInvariant()
          "$hash  $(Split-Path -Leaf $archive)" | Set-Content -LiteralPath "$archive.sha256"
          gh release upload "$env:RELEASE_TAG" $archive "$archive.sha256" --clobber

      - name: Create and attach Windows native messaging host archive
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $remoteCommit = (git ls-remote --exit-code origin "refs/tags/$env:RELEASE_TAG^{}" | ForEach-Object { ($_ -split '\s+')[0] })
          if ($remoteCommit -ne $env:RELEASE_COMMIT) { throw "Release tag moved after validation" }
          $stage = Join-Path $env:RUNNER_TEMP "QuiverDL-native-host-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item target/${{ matrix.target }}/release/quiver-native-host.exe, LICENSE, README.md -Destination $stage
          Copy-Item extensions -Destination $stage -Recurse
          $archive = Join-Path $env:RUNNER_TEMP "QuiverDL-${{ env.RELEASE_TAG }}-native-host-${{ matrix.target }}.zip"
          Compress-Archive -Path "$stage/*" -DestinationPath $archive
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash.ToLowerInvariant()
          "$hash  $(Split-Path -Leaf $archive)" | Set-Content -LiteralPath "$archive.sha256"
          gh release upload "$env:RELEASE_TAG" $archive "$archive.sha256" --clobber

      - name: Attach native messaging host archive
        if: runner.os != 'Windows'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          remote_commit="$(git ls-remote --exit-code origin "refs/tags/$RELEASE_TAG^{}" | cut -f 1)"
          test "$remote_commit" = "$RELEASE_COMMIT"
          stage="$RUNNER_TEMP/quiver-native-host-${{ matrix.target }}"
          mkdir -p "$stage"
          cp "target/${{ matrix.target }}/release/quiver-native-host" "$stage/"
          cp -R extensions "$stage/"
          cp LICENSE README.md "$stage/"
          if [ "${{ runner.os }}" = "macOS" ]; then
            archive="$RUNNER_TEMP/QuiverDL-${RELEASE_TAG}-native-host-${{ matrix.target }}.zip"
            ditto -c -k --keepParent "$stage" "$archive"
            xcrun notarytool submit "$archive" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" \
              --wait
          else
            archive="$RUNNER_TEMP/QuiverDL-${RELEASE_TAG}-native-host-${{ matrix.target }}.tar.gz"
            tar -C "$RUNNER_TEMP" -czf "$archive" "$(basename "$stage")"
          fi
          archive_dir=$(dirname "$archive")
          archive_name=$(basename "$archive")
          (cd "$archive_dir" && shasum -a 256 "$archive_name") > "$archive.sha256"
          gh release upload "$RELEASE_TAG" "$archive" "$archive.sha256" --clobber

  browser-extensions:
    name: Browser store submission archives
    needs:
      - preflight
      - linux
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      RELEASE_COMMIT: ${{ needs.preflight.outputs.release_commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.release_commit }}
      - name: Reconfirm the immutable release tag
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          remote_commit="$(git ls-remote --exit-code origin "refs/tags/$RELEASE_TAG^{}" | cut -f 1)"
          test "$remote_commit" = "$RELEASE_COMMIT"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - name: Validate and package browser companions
        run: |
          node scripts/validate-store-packaging.mjs
          node --test scripts/test-package-extensions.mjs
          node scripts/package-extensions.mjs dist/store
          cd dist/store
          sha256sum *.zip > SHA256SUMS
      - name: Attach unsigned store submission archives
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          remote_commit="$(git ls-remote --exit-code origin "refs/tags/$RELEASE_TAG^{}" | cut -f 1)"
          test "$remote_commit" = "$RELEASE_COMMIT"
          gh release upload "$RELEASE_TAG" dist/store/*.zip dist/store/SHA256SUMS --clobber
