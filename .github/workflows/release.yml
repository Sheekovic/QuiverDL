name: Signed release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  desktop:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64 installer and portable
            os: windows-latest
            args: --target x86_64-pc-windows-msvc --bundles nsis,msi --config src-tauri/tauri.release.conf.json
            target: x86_64-pc-windows-msvc
          - name: Linux x64 packages
            os: ubuntu-22.04
            args: --bundles deb,rpm,appimage
            target: x86_64-unknown-linux-gnu
          - name: macOS Apple Silicon
            os: macos-latest
            args: --target aarch64-apple-darwin --bundles app,dmg
            target: aarch64-apple-darwin
          - name: macOS Intel
            os: macos-latest
            args: --target x86_64-apple-darwin --bundles app,dmg
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-18
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Install frontend dependencies
        run: npm ci
        working-directory: apps/desktop

      - name: Require Windows signing credentials
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_CERTIFICATE -or -not $env:WINDOWS_CERTIFICATE_PASSWORD) {
            throw "Signed releases require WINDOWS_CERTIFICATE and WINDOWS_CERTIFICATE_PASSWORD"
          }
      - name: Import Windows signing certificate
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $certificateBytes = [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE)
          $certificatePath = Join-Path $env:RUNNER_TEMP "quiverdl-release.pfx"
          [IO.File]::WriteAllBytes($certificatePath, $certificateBytes)
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $certificate = Import-PfxCertificate -FilePath $certificatePath -CertStoreLocation Cert:\CurrentUser\My -Password $password
          if (-not $certificate.Thumbprint) { throw "The Windows certificate could not be imported" }
          $overlay = @{ bundle = @{ windows = @{ certificateThumbprint = $certificate.Thumbprint; digestAlgorithm = "sha256"; timestampUrl = "http://timestamp.digicert.com" } } } | ConvertTo-Json -Depth 5
          Set-Content -LiteralPath apps/desktop/src-tauri/tauri.release.conf.json -Value $overlay -Encoding UTF8
          "WINDOWS_CERT_THUMBPRINT=$($certificate.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Require Apple signing and notarization credentials
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          test -n "$APPLE_CERTIFICATE" && test -n "$APPLE_CERTIFICATE_PASSWORD" && test -n "$APPLE_ID" && test -n "$APPLE_PASSWORD" && test -n "$APPLE_TEAM_ID" && test -n "$KEYCHAIN_PASSWORD"
      - name: Import Apple Developer ID certificate
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/quiverdl-release.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import "$RUNNER_TEMP/quiverdl-release.p12" -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          identity=$(security find-identity -v -p codesigning build.keychain | awk -F'"' '/Developer ID Application/ {print $2; exit}')
          test -n "$identity"
          echo "APPLE_SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"

      - name: Build native messaging host
        run: cargo build --locked --release -p quiver-native-host --target ${{ matrix.target }}
      - name: Sign and verify Windows native host
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $signTool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signTool) { throw "signtool.exe was not found" }
          $hostPath = "target/${{ matrix.target }}/release/quiver-native-host.exe"
          & $signTool.FullName sign /sha1 $env:WINDOWS_CERT_THUMBPRINT /fd sha256 /tr http://timestamp.digicert.com /td sha256 $hostPath
          if ($LASTEXITCODE -ne 0) { throw "Native host signing failed" }
          & $signTool.FullName verify /pa $hostPath
          if ($LASTEXITCODE -ne 0) { throw "Native host signature verification failed" }
      - name: Sign and verify macOS native host
        if: runner.os == 'macOS'
        run: |
          host="target/${{ matrix.target }}/release/quiver-native-host"
          codesign --force --options runtime --timestamp --sign "$APPLE_SIGNING_IDENTITY" "$host"
          codesign --verify --strict --verbose=2 "$host"
      - name: Build, sign, and attach desktop bundles
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_SIGNING_IDENTITY: ${{ env.APPLE_SIGNING_IDENTITY }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: QuiverDL ${{ github.ref_name }}
          releaseBody: See the checksums, installation notes, and security documentation included with this release.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Create and attach Windows portable archive
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $stage = Join-Path $env:RUNNER_TEMP "QuiverDL-portable"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item target/${{ matrix.target }}/release/quiver-desktop.exe, target/${{ matrix.target }}/release/quiver-native-host.exe, LICENSE, README.md -Destination $stage
          Copy-Item extensions -Destination $stage -Recurse
          $archive = Join-Path $env:RUNNER_TEMP "QuiverDL-${{ github.ref_name }}-windows-x64-portable.zip"
          Compress-Archive -Path "$stage/*" -DestinationPath $archive
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash.ToLowerInvariant()
          "$hash  $(Split-Path -Leaf $archive)" | Set-Content -LiteralPath "$archive.sha256"
          gh release upload "${{ github.ref_name }}" $archive "$archive.sha256" --clobber

      - name: Create and attach Windows native messaging host archive
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $stage = Join-Path $env:RUNNER_TEMP "QuiverDL-native-host-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item target/${{ matrix.target }}/release/quiver-native-host.exe, LICENSE, README.md -Destination $stage
          Copy-Item extensions -Destination $stage -Recurse
          $archive = Join-Path $env:RUNNER_TEMP "QuiverDL-${{ github.ref_name }}-native-host-${{ matrix.target }}.zip"
          Compress-Archive -Path "$stage/*" -DestinationPath $archive
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash.ToLowerInvariant()
          "$hash  $(Split-Path -Leaf $archive)" | Set-Content -LiteralPath "$archive.sha256"
          gh release upload "${{ github.ref_name }}" $archive "$archive.sha256" --clobber

      - name: Attach native messaging host archive
        if: runner.os != 'Windows'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          stage="$RUNNER_TEMP/quiver-native-host-${{ matrix.target }}"
          mkdir -p "$stage"
          cp "target/${{ matrix.target }}/release/quiver-native-host" "$stage/"
          cp -R extensions "$stage/"
          cp LICENSE README.md "$stage/"
          if [ "${{ runner.os }}" = "macOS" ]; then
            archive="$RUNNER_TEMP/QuiverDL-${{ github.ref_name }}-native-host-${{ matrix.target }}.zip"
            ditto -c -k --keepParent "$stage" "$archive"
            xcrun notarytool submit "$archive" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" \
              --wait
          else
            archive="$RUNNER_TEMP/QuiverDL-${{ github.ref_name }}-native-host-${{ matrix.target }}.tar.gz"
            tar -C "$RUNNER_TEMP" -czf "$archive" "$(basename "$stage")"
          fi
          archive_dir=$(dirname "$archive")
          archive_name=$(basename "$archive")
          (cd "$archive_dir" && shasum -a 256 "$archive_name") > "$archive.sha256"
          gh release upload "${{ github.ref_name }}" "$archive" "$archive.sha256" --clobber

  browser-extensions:
    name: Browser store submission archives
    needs: desktop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - name: Validate and package browser companions
        run: |
          node scripts/validate-store-packaging.mjs
          node --test scripts/test-package-extensions.mjs
          node scripts/package-extensions.mjs dist/store
          cd dist/store
          sha256sum *.zip > SHA256SUMS
      - name: Attach unsigned store submission archives
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" dist/store/*.zip dist/store/SHA256SUMS --clobber
