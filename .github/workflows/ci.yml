name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-quality:
    name: Rust formatting and linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy -p quiver-core --all-targets -- -D warnings

  core-tests:
    name: Core tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Run engine and browser bridge tests
        run: cargo test -p quiver-core -p quiver-native-host

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Validate extension scripts and manifests
        run: |
          node --check ../../extensions/chromium/background.js
          node --check ../../extensions/chromium/options.js
          node --check ../../extensions/firefox/background.js
          node --check ../../extensions/firefox/options.js
          node ../../extensions/test-background-policy.mjs
          node -e "for (const file of process.argv.slice(1)) JSON.parse(require('fs').readFileSync(file, 'utf8'))" ../../extensions/chromium/manifest.json ../../extensions/firefox/manifest.json ../../extensions/native-host/chromium-host.json ../../extensions/native-host/firefox-host.json
          sh -n ../../extensions/native-host/install-linux.sh
          sh -n ../../extensions/native-host/install-macos.sh
          ../../extensions/native-host/test-installers.sh
          node ../../scripts/validate-updater-design.mjs
          node --test ../../scripts/test-generate-update-manifest.mjs
          node --test ../../scripts/test-prepare-updater-config.mjs
          node ../../scripts/validate-store-packaging.mjs
          node --test ../../scripts/test-package-extensions.mjs
          node ../../scripts/package-extensions.mjs ../../dist/store

  desktop-check:
    name: Desktop Rust check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
        working-directory: apps/desktop
      - name: Test Windows native host installer
        shell: powershell
        run: .\extensions\native-host\test-install-windows.ps1
      - name: Validate Microsoft Store scripts and manifest
        shell: powershell
        run: |
          foreach ($script in @(
            '.\scripts\prepare-microsoft-store-config.ps1',
            '.\scripts\package-msix.ps1'
          )) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $script),
              [ref] $tokens,
              [ref] $errors
            ) | Out-Null
            if ($errors.Count -ne 0) { throw ($errors | Out-String) }
          }
          [xml] $manifest = Get-Content -Raw .\packaging\windows\msix\AppxManifest.xml.template
          if ($manifest.Package.Identity.Name -ne 'SHEEKOVIC.QuiverDL') {
            throw 'The MSIX manifest identity does not match Partner Center.'
          }
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Run workspace Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Run workspace tests
        run: cargo test --workspace
      - name: Build and validate Microsoft Store MSIX
        shell: powershell
        run: .\scripts\package-msix.ps1 -OutputDirectory $env:RUNNER_TEMP\store
