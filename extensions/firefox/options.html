<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>QuiverDL settings</title>
<link rel="stylesheet" href="options.css">
<main>
  <h1>Download with QuiverDL</h1>
  <p>Firefox connects automatically. Keep QuiverDL running in the tray.</p>
  <label><input id="enabled" type="checkbox"> Download through QuiverDL</label>
  <p>When QuiverDL is unavailable, your download stays in Firefox.</p>
  <details><summary>Download rules</summary>
    <label>Minimum file size (MB, 0 means all sizes)<input id="minimum" type="number" min="0" max="100000"></label>
    <label>Only capture these domains (leave empty for all sites)<textarea id="domains" rows="4"></textarea></label>
  </details>
  <button id="save">Save</button>
  <button id="check" type="button">Check connection</button>
  <output id="status" role="status"></output>
</main>
<script src="transport.js"></script>
<script src="options.js"></script>
</html>
