<!doctype html><html lang="en"><meta charset="utf-8"><title>QuiverDL settings</title><link rel="stylesheet" href="options.css"><main><h1>QuiverDL browser companion</h1><p>Manual “Download with QuiverDL” is always available. Automatic interception is opt-in and local.</p><label>Pairing token<input id="token" type="password" autocomplete="off"></label><label><input id="enabled" type="checkbox"> Enable rule-based interception</label><label>Minimum file size (MB)<input id="minimum" type="number" min="1" max="100000"></label><label>Allowed domains, one per line (empty means any domain)<textarea id="domains" rows="6"></textarea></label><button id="save">Save locally</button><output id="status"></output><script src="options.js"></script></main></html>
